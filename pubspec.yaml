name: simple_voice_app
description: "Svg-App is the official Android companion for SimpleVoice-Geyser, providing voice and server chat for Bedrock players."
publish_to: 'none'
repository: https://github.com/TheodoreMeyer/Svg-App
issue_tracker: https://github.com/TheodoreMeyer/Svg-App/issues

version: 1.1.0+4

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/icon.png
    - assets/textures/dirt.png
    - assets/textures/stone.png
    - assets/fonts/OFL.txt
    - assets/SimpleVoice-Geyser-LICENSE.txt
    - assets/NOTICE.md

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
